[build-system]
requires = ["hatchling>=1.9.0", "hatch-vcs", "toml"]


[project]
dynamic = ["version"]
authors = [
  { name="Sebastien J. Weber", email="sebastien.weber@cemes.fr" },
]

dependencies = ['pint', 'pydantic>=2']

description = "Optical laser damage and risk calculation"
readme = "README.rst"
license = { file="LICENSE" }
requires-python = ">=3.9"

name = "laser_risk_calculator"


classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Other Environment",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: European Union Public Licence 1.2 (EUPL 1.2)",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Human Machine Interfaces",
    "Topic :: Scientific/Engineering :: Visualization",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: User Interfaces",
]

[project.optional-dependencies]
qt = ['pymodaq_gui']
test = ['pytest']

[project.urls]
Homepage = "https://github.com/seb5g/laser_risk_calculator"
Issues = "https://github.com/seb5g/laser_risk_calculator/issues"

[project.scripts]
laser-risk = "laser_risk_calculator.cli:main"
laser-risk-gui = "laser_risk_calculator.qt_backend.laser_gui:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.hatch.metadata.hooks.custom]

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.sdist]
include = [
    "/src",
]
